<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Dark is the default and lives in the stylesheet. This only stamps a
         choice someone has already made, before the stylesheet applies, so a
         returning light-mode visitor never sees a dark first frame. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("portfolio-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* private mode / blocked storage — stay on the dark default */
        }
      })();
    </script>
    <meta name="description" content="Sanket Pande — Full Stack Software Engineer. 7+ years building backend systems and cloud infrastructure in Python, Django and GCP." />
    <title>Sanket Pande — Full Stack Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
